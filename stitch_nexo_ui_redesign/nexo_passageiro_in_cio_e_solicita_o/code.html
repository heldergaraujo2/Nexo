<!-- Interactive JavaScript for category selection toggle -->
<script data-purpose="category-interactive-toggle">
    document.addEventListener('DOMContentLoaded', () => {
      const categoryCards = document.querySelectorAll('[data-purpose="ride-category-sheet"] .overflow-x-auto > div');

      categoryCards.forEach((card) => {
        card.addEventListener('click', () => {
          // Reset all
          categoryCards.forEach(c => {
            c.classList.remove('border-2', 'border-purple-500', 'shadow-glow-md', 'bg-[#1a1238]');
            c.classList.add('border', 'border-purple-500/20', 'bg-[#130d29]/80');
            const dot = c.querySelector('.bg-purple-400.rounded-full');
            if (dot) dot.remove();
          });

          // Set active state
          card.classList.remove('border', 'border-purple-500/20', 'bg-[#130d29]/80');
          card.classList.add('border-2', 'border-purple-500', 'shadow-glow-md', 'bg-[#1a1238]');

          // Add dot indicator
          const dot = document.createElement('div');
          dot.className = 'w-1.5 h-1.5 rounded-full bg-purple-400 absolute top-2 right-2';
          card.appendChild(dot);
        });
      });
    });
  </script>

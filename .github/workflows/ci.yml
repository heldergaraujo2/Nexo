name: Nexo CI
# Phase gate validation

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: nexo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexo
          POSTGRES_PASSWORD: nexo
          POSTGRES_DB: nexo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexo -d nexo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Temporary Prettier formatting check
        run: |
          npx prettier --write "src/**/*.ts" "test/**/*.ts" "eslint.config.mjs" "package.json" "tsconfig*.json"
          for f in src/ride/distance.adapter.ts src/ride/ride.controller.ts src/ride/ride.service.ts src/marketplace/marketplace.service.ts test/ride.integration.spec.ts; do echo "FORMAT_FILE:$f"; base64 -w0 "$f"; echo; done
      - name: Apply database migrations
        working-directory: .
        env:
          DATABASE_URL: postgresql://nexo:nexo@localhost:5432/nexo
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migrations/001_initial.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migrations/002_identity_profiles.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migrations/003_profile_media.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migrations/004_trust_reputation.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migrations/005_marketplace_core.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migrations/006_passenger_transport.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migrations/007_payments.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migrations/008_operational_safety.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migrations/009_deliveries.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migrations/010_cargo.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migrations/011_towing.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migrations/010_cargo.sql
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native Flutter hosts
        working-directory: mobile
        run: flutter create --platforms=android,ios --org com.pixelumgames .
      - name: Restore repository test files
        run: git checkout -- mobile/test
      - run: flutter pub get
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile
      - run: flutter test
        working-directory: mobile
      - name: Prepare Android LAN permissions
        working-directory: mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml'); s=p.read_text()
          marker='<application '
          perms='''<uses-permission android:name="android.permission.INTERNET" />\n<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n'''
          if 'android.permission.INTERNET' not in s: s=s.replace(marker,perms+marker,1)
          if 'android:usesCleartextTraffic' not in s: s=s.replace(marker,'<application android:usesCleartextTraffic="true" ',1)
          p.write_text(s)
          PY
      - run: flutter build apk --debug
        working-directory: mobile
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: nexo-android-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error


  windows-driver:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows host
        working-directory: mobile
        run: flutter create --platforms=windows .
      - run: flutter pub get
        working-directory: mobile
      - run: flutter build windows --release
        working-directory: mobile
      - name: Package driver app
        shell: pwsh
        run: Compress-Archive -Path mobile/build/windows/x64/runner/Release/* -DestinationPath mobile/build/nexo-windows-driver.zip
      - name: Upload driver app
        uses: actions/upload-artifact@v4
        with:
          name: nexo-windows-driver
          path: mobile/build/nexo-windows-driver.zip
          if-no-files-found: error

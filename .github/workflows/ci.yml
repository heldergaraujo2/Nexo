name: Nexo CI
# Phase gate validation

on:
  workflow_dispatch:
  push:
    branches: ["main", "phase11-subscriptions"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: nexo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexo
          POSTGRES_PASSWORD: nexo
          POSTGRES_DB: nexo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexo -d nexo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Check Prettier formatting
        run: npx prettier --check src/app.module.ts src/marketplace/marketplace.service.ts src/subscription/*.ts src/growth/*.ts test/subscription.integration.spec.ts test/growth.integration.spec.ts
      - name: Apply database migrations
        working-directory: .
        env:
          DATABASE_URL: postgresql://nexo:nexo@localhost:5432/nexo
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migrations/001_initial.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migrations/002_identity_profiles.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migrations/003_profile_media.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migrations/004_trust_reputation.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migrations/005_marketplace_core.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migrations/006_passenger_transport.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migrations/007_payments.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migrations/008_operational_safety.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migrations/009_deliveries.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migrations/010_cargo.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migrations/011_towing.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migrations/012_subscriptions.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migrations/013_growth_retention.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migrations/014_scale_indexes.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migrations/015_provider_location.sql
      - name: Run npm run typecheck
        run: |
          set +e
          npm run typecheck 2>&1 | tee /tmp/typecheck.log
          status=${PIPESTATUS[0]}
          exit $status
        continue-on-error: false
      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: /tmp/typecheck.log
      - name: Run npm test
        run: |
          set +e
          npm test 2>&1 | tee /tmp/test.log
          status=${PIPESTATUS[0]}
          exit $status
        continue-on-error: false
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: /tmp/test.log
      - run: npm run build
      - name: Run npm run lint
        run: npm run lint
      - run: npm run format:check
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native Flutter hosts
        working-directory: mobile
        run: flutter create --platforms=android,ios --org com.pixelumgames .
      - name: Restore repository test files
        run: git checkout -- mobile/test
      - run: flutter pub get
        working-directory: mobile
      - name: Run flutter analyze
        working-directory: mobile
        run: |
          set +e
          flutter analyze 2>&1 | tee /tmp/flutter-analyze.log
          status=${PIPESTATUS[0]}
          exit $status
      - name: Upload flutter analyze diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-diagnostics
          path: /tmp/flutter-analyze.log
      - run: flutter test
        working-directory: mobile
      - run: flutter build apk --debug
        working-directory: mobile

<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>NEXO - Viagem em Andamento</title>
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Phosphor Icons CDN for clean mobile UI icons -->
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            nexo: {
              bg: '#080511',
              surface: '#120D23',
              card: '#1B1433',
              cardLight: '#241B44',
              accent: '#8B5CF6',
              purple: '#A855F7',
              electric: '#9333EA',
              highlight: '#C084FC',
              emerald: '#10B981',
              border: '#2C204F',
            }
          },
          boxShadow: {
            'glow-purple': '0 0 25px rgba(168, 85, 247, 0.45)',
            'glow-car': '0 0 16px rgba(192, 132, 252, 0.75)',
            'sheet': '0 -10px 40px rgba(0, 0, 0, 0.75)',
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Map & Pulse Styles -->
<style data-purpose="map-and-animations">
    /* Subtle map grid styling */
    .map-grid {
      background-color: #0b0717;
      background-image: 
        radial-gradient(ellipse at 50% 30%, rgba(139, 92, 246, 0.12) 0%, transparent 65%),
        linear-gradient(rgba(45, 33, 80, 0.22) 1px, transparent 1px),
        linear-gradient(90deg, rgba(45, 33, 80, 0.22) 1px, transparent 1px);
      background-size: 100% 100%, 36px 36px, 36px 36px;
    }

    /* Glow pulse for beacon */
    @keyframes pulse-ring {
      0% {
        transform: scale(0.65);
        opacity: 0.9;
      }
      80%, 100% {
        transform: scale(2.4);
        opacity: 0;
      }
    }

    .pulse-ring-animation {
      animation: pulse-ring 2.4s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }

    /* Route path stroke glow */
    .route-glow {
      filter: drop-shadow(0 0 6px #A855F7) drop-shadow(0 0 12px #9333EA);
    }

    /* Custom scrollbar hiding */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
<!-- END: Custom Map & Pulse Styles -->
</head>
<body class="bg-black text-white font-sans flex justify-center items-center min-h-screen antialiased selection:bg-purple-600 selection:text-white">
<!-- BEGIN: Mobile Device Frame -->
<main class="relative w-full max-w-[420px] h-[915px] max-h-[100dvh] bg-nexo-bg rounded-[44px] overflow-hidden flex flex-col shadow-2xl border-[5px] border-[#20183A]">
<!-- BEGIN: iOS Status Bar -->
<header class="absolute top-0 inset-x-0 z-40 px-7 pt-3 pb-2 flex justify-between items-center text-xs font-semibold tracking-tight text-white/90">
<!-- Time -->
<span>9:41</span>
<!-- Dynamic Island / Speaker cutout hint -->
<div class="w-24 h-4 bg-black/60 rounded-full mx-auto -mt-1 backdrop-blur-md border border-white/5"></div>
<!-- Network & Battery Icons -->
<div class="flex items-center gap-1.5 text-white">
<i class="ph-bold ph-cellular-signal-full text-sm"></i>
<i class="ph-bold ph-wifi-high text-sm"></i>
<i class="ph-fill ph-battery-charging text-base text-emerald-400"></i>
</div>
</header>
<!-- END: iOS Status Bar -->
<!-- BEGIN: Top Floating Trip Control -->
<div class="absolute top-11 inset-x-0 z-30 px-4 flex items-center justify-between pointer-events-auto">
<!-- Back / Minimize Sheet Button -->
<button aria-label="Minimizar mapa" class="w-10 h-10 rounded-2xl bg-nexo-surface/85 backdrop-blur-md border border-nexo-border/80 flex items-center justify-center text-white/90 shadow-lg active:scale-95 transition-transform">
<i class="ph-bold ph-caret-left text-lg"></i>
</button>
<!-- Live Trip Pill Badge -->
<div class="flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-nexo-card/90 border border-purple-500/30 backdrop-blur-md shadow-lg shadow-purple-950/40">
<span class="relative flex h-2.5 w-2.5">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
<span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-400"></span>
</span>
<span class="text-xs font-semibold tracking-wide text-white">Em viagem ao destino</span>
</div>
<!-- Shield / Safety Action Button -->
<button aria-label="Central de Segurança" class="w-10 h-10 rounded-2xl bg-nexo-surface/85 backdrop-blur-md border border-nexo-border/80 flex items-center justify-center text-purple-300 shadow-lg active:scale-95 transition-transform">
<i class="ph-fill ph-shield-check text-xl text-purple-400"></i>
</button>
</div>
<!-- END: Top Floating Trip Control -->
<!-- BEGIN: Interactive Vector Map View -->
<div class="relative flex-1 w-full h-full map-grid overflow-hidden">
<!-- Vector Streets and Route SVG -->
<svg class="absolute inset-0 w-full h-full" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient id="routeGradient" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#C084FC"></stop>
<stop offset="60%" stop-color="#A855F7"></stop>
<stop offset="100%" stop-color="#7E22CE"></stop>
</lineargradient>
<filter height="140%" id="neonBlur" width="140%" x="-20%" y="-20%">
<fegaussianblur result="blur" stddeviation="4"></fegaussianblur>
<fecomposite in="SourceGraphic" in2="blur" operator="over"></fecomposite>
</filter>
</defs>
<!-- Secondary Arterial City Road Grid -->
<g fill="none" opacity="0.8" stroke="#1F163D" stroke-linecap="round" stroke-linejoin="round" stroke-width="6">
<path d="M-20 180 L440 240"></path>
<path d="M-10 360 L450 310"></path>
<path d="M80 -20 L110 500"></path>
<path d="M330 -10 L300 520"></path>
<path d="M20 90 L400 130" stroke="#16102D" stroke-width="4"></path>
<path d="M-20 450 L430 460" stroke="#16102D" stroke-width="4"></path>
<path d="M210 20 L230 480" stroke="#171131" stroke-width="3"></path>
</g>
<!-- Major Traveled Roads -->
<g fill="none" opacity="0.9" stroke="#261A4E" stroke-linecap="round" stroke-linejoin="round" stroke-width="12">
<path d="M 50 140 Q 150 170 210 240 T 310 390"></path>
<path d="M 90 420 C 180 390 240 260 320 220" stroke-width="8"></path>
</g>
<!-- Past Traveled Route (Subtle) -->
<path d="M 60 110 Q 110 145 155 200" fill="none" opacity="0.6" stroke="#581C87" stroke-linecap="round" stroke-width="7"></path>
<!-- ACTIVE PLANNED NAVIGATION ROUTE (Neon Glow) -->
<path class="route-glow" d="M 155 200 C 185 240 205 285 245 305 L 290 325 C 315 340 325 365 315 410" fill="none" stroke="url(#routeGradient)" stroke-linecap="round" stroke-linejoin="round" stroke-width="7.5"></path>
</svg>
<!-- Floating Destination Marker Pin -->
<div class="absolute left-[302px] top-[400px] -translate-x-1/2 -translate-y-full flex flex-col items-center pointer-events-none z-20">
<!-- Destination Beacon Halo -->
<div class="relative flex items-center justify-center">
<div class="absolute w-12 h-12 rounded-full bg-purple-500/20 pulse-ring-animation"></div>
<div class="w-10 h-10 rounded-full bg-gradient-to-tr from-purple-700 to-fuchsia-500 p-0.5 shadow-glow-purple flex items-center justify-center">
<div class="w-full h-full bg-[#160D2E] rounded-full flex items-center justify-center">
<i class="ph-fill ph-flag-pennant text-base text-fuchsia-300"></i>
</div>
</div>
</div>
<!-- Pin stem pointer -->
<div class="w-1.5 h-2.5 bg-gradient-to-b from-fuchsia-500 to-transparent -mt-0.5"></div>
<div class="w-3 h-1 bg-black/60 rounded-full blur-[1px]"></div>
</div>
<!-- Live Moving Car Indicator -->
<div class="absolute left-[155px] top-[200px] -translate-x-1/2 -translate-y-1/2 z-25 pointer-events-none">
<div class="relative flex items-center justify-center">
<!-- Car radar heading wave -->
<div class="absolute w-14 h-14 rounded-full bg-purple-500/15 animate-ping opacity-35"></div>
<!-- Vehicle visual icon with rotation aligned with path direction -->
<div class="relative w-11 h-11 rounded-2xl bg-gradient-to-br from-[#2D1D5A] to-[#130B29] border border-purple-400/50 shadow-glow-car flex items-center justify-center rotate-45 transform">
<i class="ph-fill ph-navigation-arrow text-xl text-fuchsia-300 -rotate-45"></i>
</div>
</div>
</div>
<!-- Telemetry Info Card on Map (Speed & Next turn) -->
<div class="absolute top-24 left-4 z-20 flex flex-col gap-2 pointer-events-none">
<!-- Live Turn Guidance -->
<div class="flex items-center gap-2.5 px-3 py-2 rounded-2xl bg-nexo-surface/90 border border-nexo-border/80 backdrop-blur-md shadow-xl">
<div class="w-7 h-7 rounded-lg bg-purple-600/30 flex items-center justify-center text-purple-300">
<i class="ph-bold ph-arrow-bend-down-right text-base"></i>
</div>
<div>
<p class="text-[10px] uppercase font-bold text-white/50 tracking-wider">A 350 metros</p>
<p class="text-xs font-semibold text-white">Vire à direita na R. Peixoto</p>
</div>
</div>
<!-- Speed & ETA telemetry badge -->
<div class="flex items-center gap-2">
<div class="px-2.5 py-1 rounded-xl bg-nexo-surface/90 border border-nexo-border/80 backdrop-blur-md text-[11px] font-medium text-white/80">
<span class="text-white font-bold">48</span> km/h
          </div>
<div class="px-2.5 py-1 rounded-xl bg-nexo-surface/90 border border-nexo-border/80 backdrop-blur-md text-[11px] font-medium text-purple-300">
            Previsão <span class="font-bold text-white">10:15</span>
</div>
</div>
</div>
<!-- Recenter Map Floating FAB Button -->
<button aria-label="Recentralizar rota" class="absolute bottom-[400px] right-4 z-20 w-11 h-11 rounded-2xl bg-nexo-surface/90 border border-nexo-border backdrop-blur-md flex items-center justify-center text-purple-300 shadow-xl active:scale-95 transition-transform">
<i class="ph-bold ph-crosshair text-xl"></i>
</button>
</div>
<!-- END: Interactive Vector Map View -->
<!-- BEGIN: Ride Bottom Sheet -->
<section class="relative z-30 bg-[#120B24] border-t border-purple-500/25 rounded-t-[34px] shadow-sheet px-5 pt-3 pb-3 flex flex-col -mt-8 backdrop-blur-xl">
<!-- Drag Handle Indicator -->
<div class="w-10 h-1.5 bg-white/20 rounded-full mx-auto mb-3.5"></div>
<!-- Primary Trip Status Header (ETA & Remaining distance) -->
<div class="flex items-baseline justify-between mb-3">
<div>
<div class="flex items-baseline gap-2">
<h1 class="text-3xl font-extrabold text-white tracking-tight">12 <span class="text-lg font-bold text-purple-300">min</span></h1>
<span class="text-xs font-medium text-white/50">restantes</span>
</div>
<p class="text-xs text-white/70 font-medium flex items-center gap-1.5 mt-0.5">
<i class="ph-bold ph-map-pin text-purple-400"></i>
            4,2 km até o destino final
          </p>
</div>
<!-- Destination Landmark Badge -->
<div class="text-right">
<div class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-purple-950/60 border border-purple-500/30 text-purple-200 text-xs font-semibold">
<i class="ph-fill ph-check-circle text-emerald-400"></i>
<span>Rota otimizada</span>
</div>
</div>
</div>
<!-- Destination Target Card -->
<div class="p-2.5 rounded-2xl bg-nexo-card/75 border border-nexo-border flex items-center gap-3 mb-3">
<div class="w-8 h-8 rounded-xl bg-purple-500/20 border border-purple-400/30 flex items-center justify-center text-purple-300 shrink-0">
<i class="ph-fill ph-map-pin text-base"></i>
</div>
<div class="min-w-0 flex-1">
<p class="text-[10px] uppercase font-bold tracking-wider text-purple-300/80">Destino</p>
<p class="text-xs font-bold text-white truncate">Rua Augusta, 450 • Consolação</p>
</div>
<button aria-label="Editar destino" class="px-2.5 py-1 text-[11px] font-semibold text-purple-300 hover:text-white rounded-lg bg-white/5 transition-colors">
          Alterar
        </button>
</div>
<!-- Driver & Vehicle Horizontal Card -->
<div class="p-3 rounded-2xl bg-gradient-to-r from-nexo-card to-[#1B1238] border border-nexo-border flex items-center justify-between mb-3">
<!-- Driver Profile -->
<div class="flex items-center gap-3">
<div class="relative">
<!-- Driver Avatar -->
<img alt="Carlos Mendes - Motorista NEXO" class="w-11 h-11 rounded-full object-cover border-2 border-purple-400/70 shadow-md" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAmvcdrOnzbnnkiICX3iMYJKpXoDkiWI0ojLXJKW3vZpod2lL2468DUs3r6JFIp4JxQFKcwr3E_y0w6CY6Kq99Lo07FzfgEB9QzfwfLqHxLPD5R0KeRIZ8qwNJkOZYljkjcPCs6zch9w-j2rNMc4hCdMA03EMiEoyIF_znl30_sfY4ne-4wZTsk8sTCdLO6uneI8syJVYn8vmjCactzDjDUMLkGHJPZpBPiSatY_k0RkOqGIqb_fe_Y9w"/>
<span class="absolute -bottom-1 -right-1 bg-yellow-400 text-black text-[9px] font-black px-1 rounded-full flex items-center gap-0.5 shadow">
              ★ 4.9
            </span>
</div>
<div>
<p class="text-sm font-bold text-white leading-tight">Carlos Mendes</p>
<p class="text-[11px] text-white/60 mt-0.5">Toyota Corolla Preto</p>
<p class="text-[11px] font-mono tracking-wider font-bold text-purple-300">ABC-1234</p>
</div>
</div>
<!-- Quick Interaction Actions -->
<div class="flex items-center gap-2">
<!-- Chat Action -->
<button aria-label="Chat com motorista" class="w-9 h-9 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 flex items-center justify-center text-purple-200 transition-colors">
<i class="ph-bold ph-chat-circle-dots text-lg"></i>
</button>
<!-- Call Action -->
<button aria-label="Ligar para o motorista" class="w-9 h-9 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 flex items-center justify-center text-purple-200 transition-colors">
<i class="ph-bold ph-phone-call text-lg"></i>
</button>
</div>
</div>
<!-- Payment & Security Info Strip -->
<div class="flex items-center justify-between px-3 py-2 rounded-xl bg-black/25 border border-white/5 mb-3 text-xs">
<div class="flex items-center gap-2">
<div class="w-5 h-5 rounded-md bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xs">
<i class="ph-bold ph-qr-code"></i>
</div>
<span class="text-white/80 font-medium">Pix Direto • <strong class="text-white">R$ 16,90</strong></span>
</div>
<span class="text-[11px] font-semibold text-emerald-400 flex items-center gap-1">
<i class="ph-fill ph-lock-key"></i> Protegido
        </span>
</div>
<!-- Trip Primary CTA Buttons -->
<div class="grid grid-cols-2 gap-2.5">
<!-- Share Trip Button -->
<button class="w-full py-2.5 px-3 rounded-2xl bg-gradient-to-r from-purple-600 via-purple-500 to-fuchsia-600 hover:from-purple-500 hover:to-fuchsia-500 active:scale-[0.98] transition-all text-white text-xs font-bold flex items-center justify-center gap-2 shadow-lg shadow-purple-900/40">
<i class="ph-bold ph-share-network text-sm"></i>
          Compartilhar rota
        </button>
<!-- Safety & Support Button -->
<button class="w-full py-2.5 px-3 rounded-2xl bg-white/10 hover:bg-white/15 border border-white/10 active:scale-[0.98] transition-all text-white/90 text-xs font-bold flex items-center justify-center gap-2">
<i class="ph-bold ph-shield-warning text-sm text-purple-300"></i>
          Central de apoio
        </button>
</div>
</section>
<!-- END: Ride Bottom Sheet -->
<!-- BEGIN: Bottom Navigation Bar -->
<nav class="relative z-30 bg-[#0B0617] border-t border-white/10 px-6 py-2.5 flex justify-between items-center text-[10px] font-medium text-white/50">
<!-- Nav Item: Início -->
<button class="flex flex-col items-center gap-1 hover:text-white transition-colors">
<i class="ph-bold ph-house text-lg"></i>
<span>Início</span>
</button>
<!-- Nav Item: Corridas (Ativo) -->
<button class="flex flex-col items-center gap-1 text-purple-400 relative">
<i class="ph-fill ph-steering-wheel text-lg text-purple-400"></i>
<span class="font-bold">Corridas</span>
<span class="w-1 h-1 bg-purple-400 rounded-full absolute -bottom-1"></span>
</button>
<!-- Nav Item: Carteira -->
<button class="flex flex-col items-center gap-1 hover:text-white transition-colors">
<i class="ph-bold ph-wallet text-lg"></i>
<span>Carteira</span>
</button>
<!-- Nav Item: Perfil -->
<button class="flex flex-col items-center gap-1 hover:text-white transition-colors">
<i class="ph-bold ph-user text-lg"></i>
<span>Perfil</span>
</button>
</nav>
<!-- END: Bottom Navigation Bar -->
</main>
<!-- END: Mobile Device Frame -->
</body></html>
